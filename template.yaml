AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Remote Developer — browser terminal running Claude Code and Codex in per-user
  AWS Lambda MicroVMs, with Cognito auth and per-user S3 Files home directories.

# ─────────────────────────────────────────────────────────────────────────────
# Layout of this template:
#   Parameters  — values only knowable at deploy time (see the block's own comment)
#   Networking  — VPC, NAT, subnets, NFS security group
#   Storage     — S3 buckets + the S3 Files filesystem/mount targets
#   Identity    — Cognito user pool + the IAM roles
#   Compute     — token-vending Lambda + API Gateway (Cognito-authorized)
#   Frontend    — S3 origin + CloudFront
#   Egress      — Lambda network connector (VPC egress for the MicroVMs)
#   Outputs     — everything deploy.sh / the frontend need
#
# IAM policy precedence (per the project convention): SAM policy templates first,
# then AWS managed policies, then inline. The token Lambda's permissions
# (SSM write, s3files access-point CRUD, microvm lifecycle, PassRole) have no
# matching policy template, so they are necessarily inline.
# ─────────────────────────────────────────────────────────────────────────────

Parameters:
  # Two categories only: values genuinely unknowable until deploy time
  # (MicrovmCodeUri, WebSearchGatewayUrl — deploy.sh computes/discovers these
  # itself every run), and personalization knobs meant to be set once via
  # `sam deploy --guided` or samconfig.toml's parameter_overrides, not by
  # deploy.sh (LoginEmail). Everything else that's a fixed, non-personal
  # choice (image name, memory tier, capabilities, base image version) is a
  # literal directly on the MicrovmImage resource below — not a Parameter.
  LoginEmail:
    Type: String
    Default: you@example.com
    Description: >-
      Email for the admin-create-user command in this stack's Outputs.
      Cosmetic — set your own once via `sam deploy --guided` or
      samconfig.toml's parameter_overrides; CloudFormation retains it on
      every later deploy.sh run without deploy.sh ever passing it.
  MicrovmCodeUri:
    Type: String
    Description: >-
      s3://bucket/key of the zipped microvm/ source. deploy.sh computes this
      from a content hash of the zip on every deploy — CloudFormation only
      diffs property VALUES, and unlike AWS::Serverless::Function this
      resource is NOT in SAM's local-file auto-upload list, so a content
      hash in the key is what makes a real code change actually trigger a
      rebuild instead of silently no-op'ing against a stale key.
  WebSearchGatewayUrl:
    Type: String
    Default: ""
    Description: AgentCore web-search MCP endpoint (created out-of-band by deploy.sh; see WebSearchGatewayRole below).

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    Timeout: 30
    MemorySize: 256

Resources:

  # ── Networking ──────────────────────────────────────────────────────────────
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: ipad-claude-vpc }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  IgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref PublicRouteTable, SubnetId: !Ref PublicSubnet1 }

  PublicSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref PublicRouteTable, SubnetId: !Ref PublicSubnet2 }

  NatEip:
    Type: AWS::EC2::EIP
    Properties: { Domain: vpc }

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet1

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref PrivateRouteTable, SubnetId: !Ref PrivateSubnet1 }

  PrivateSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref PrivateRouteTable, SubnetId: !Ref PrivateSubnet2 }

  # NFS (2049) within the VPC — S3 Files mount targets live behind this.
  NfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow NFS traffic for S3 Files mount targets
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          CidrIp: 10.0.0.0/16

  # ── Storage ─────────────────────────────────────────────────────────────────
  # Workspace bucket backs the S3 Files filesystem (per-user home directories).
  # Versioning is required by S3 Files. Retained so homes survive a stack delete.
  WorkspaceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }

  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  # Role S3 Files assumes to sync the bucket + manage its change-detection rules.
  # Inline: this is a service-linked-style trust policy with no policy-template equivalent.
  S3FilesRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: elasticfilesystem.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
              ArnLike: { aws:SourceArn: !Sub "arn:aws:s3files:${AWS::Region}:${AWS::AccountId}:file-system/*" }
      Policies:
        - PolicyName: BucketAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket, s3:ListBucketVersions]
                Resource: !GetAtt WorkspaceBucket.Arn
                Condition: { StringEquals: { aws:ResourceAccount: !Ref AWS::AccountId } }
              - Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:List*
                  - s3:PutObject
                  - s3:PutObjectAcl
                Resource: !Sub "${WorkspaceBucket.Arn}/*"
                Condition: { StringEquals: { aws:ResourceAccount: !Ref AWS::AccountId } }
              - Effect: Allow
                Action: [events:DeleteRule, events:DisableRule, events:EnableRule, events:PutRule, events:PutTargets, events:RemoveTargets]
                Resource: arn:aws:events:*:*:rule/DO-NOT-DELETE-S3-Files*
                Condition: { StringEquals: { events:ManagedBy: elasticfilesystem.amazonaws.com } }
              - Effect: Allow
                Action: [events:DescribeRule, events:ListRuleNamesByTarget, events:ListRules, events:ListTargetsByRule]
                Resource: arn:aws:events:*:*:rule/*

  # S3 Files filesystem (NFS over the workspace bucket) + a mount target per AZ.
  S3FilesFileSystem:
    Type: AWS::S3Files::FileSystem
    Properties:
      Bucket: !GetAtt WorkspaceBucket.Arn
      RoleArn: !GetAtt S3FilesRole.Arn
      AcceptBucketWarning: true

  S3FilesMountTarget1:
    Type: AWS::S3Files::MountTarget
    Properties:
      FileSystemId: !GetAtt S3FilesFileSystem.FileSystemId
      SubnetId: !Ref PrivateSubnet1
      SecurityGroups: [!Ref NfsSecurityGroup]

  S3FilesMountTarget2:
    Type: AWS::S3Files::MountTarget
    Properties:
      FileSystemId: !GetAtt S3FilesFileSystem.FileSystemId
      SubnetId: !Ref PrivateSubnet2
      SecurityGroups: [!Ref NfsSecurityGroup]

  # ── Identity ────────────────────────────────────────────────────────────────
  # Admin-created users only — no self-signup.
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: ipad-claude-users
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: true }
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: ipad-claude-web
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits: { AccessToken: hours, IdToken: hours, RefreshToken: days }

  # MicroVM build role — reads the image artifact from S3.
  # AWS managed policy for basic Lambda logging, inline for the artifact read.
  MicroVmBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition: { StringEquals: { aws:SourceAccount: !Ref AWS::AccountId } }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ArtifactRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub "${ArtifactBucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ArtifactBucket.Arn

  # The MicroVM image itself. Was hand-rolled via aws lambda-microvms
  # create-microvm-image/update-microvm-image in deploy.sh — moved here once
  # AWS::Serverless::MicrovmImage shipped (June 2026), which maps 1:1 onto
  # those CLI flags and, crucially, fixes the CLI's worst footgun: `update-
  # microvm-image` REPLACED the whole version config on every call, silently
  # resetting capabilities/hooks/env vars unless you re-passed all of them
  # every time. As an ordinary CFN resource, the full property set is always
  # declared, that class of bug can't happen, and CloudFormation's own async
  # stabilization replaces our manual CREATING-poll loop.
  #
  # BaseImageVersion and EgressNetworkConnectors below aren't arbitrary —
  # they mirror what the CLI path was already resolving to by default
  # (confirmed via get-microvm-image-version on the live image, which
  # reported the resolved version as "1.0" — but this resource's input
  # wants just the major version, "1"). Resources.MinimumMemoryInMiB is the
  # one property deliberately NOT left at that old default: the CLI path
  # never set it, so it silently floated at the platform default of 2048 MiB
  # even though config.env.example used to carry an MVM_MEMORY=8192 that
  # nothing ever actually consumed — the kind of dead, misleading config
  # this migration is meant to make impossible. There is no config.env
  # equivalent now; this literal IS the configuration.
  #
  # MinimumMemoryInMiB is a fixed-tier picker, not a free-form value —
  # Lambda MicroVMs bill continuously at this baseline while running and
  # auto-burst up to 4x it under load (billed per-second, only while
  # actually bursting): 512→2048 peak, 1024→4096 peak, 2048→8192 peak,
  # 4096→16384 peak, 8192→32768 peak. 4096 (4 GB baseline / 16 GB peak,
  # 2 vCPU baseline / 8 vCPU peak) was chosen over the platform default of
  # 2048 for headroom on sustained Claude Code / build workloads, without
  # paying the 8192 tier's continuous rate for capacity mostly needed only
  # in bursts. Change this literal directly to move tiers.
  MicrovmImage:
    Type: AWS::Serverless::MicrovmImage
    Properties:
      Name: remote-dev
      CodeUri: !Ref MicrovmCodeUri
      BuildRoleArn: !GetAtt MicroVmBuildRole.Arn
      BaseImageArn: !Sub "arn:aws:lambda:${AWS::Region}:aws:microvm-image:al2023-1"
      BaseImageVersion: "1"
      AdditionalOsCapabilities: [ALL]
      Resources:
        - MinimumMemoryInMiB: 4096
      EgressNetworkConnectors:
        - !Sub "arn:aws:lambda:${AWS::Region}:aws:network-connector:aws-network-connector:INTERNET_EGRESS"
      EnvironmentVariables:
        S3_FILES_FS_ID: !GetAtt S3FilesFileSystem.FileSystemId
        WEBSEARCH_GATEWAY_URL: !Ref WebSearchGatewayUrl
      Hooks:
        Port: 9000
        MicrovmImageHooks:
          Ready: ENABLED
          ReadyTimeoutInSeconds: 180
          Validate: ENABLED
          ValidateTimeoutInSeconds: 300
        MicrovmHooks:
          Run: ENABLED
          RunTimeoutInSeconds: 10
          Resume: ENABLED
          ResumeTimeoutInSeconds: 10
          Suspend: ENABLED
          SuspendTimeoutInSeconds: 10
          Terminate: ENABLED
          TerminateTimeoutInSeconds: 10

  # Permissions boundary for roles created FROM INSIDE the sandbox. The
  # execution role may create/manage IAM roles only if the new role carries
  # this boundary, and the boundary caps every such role at sandbox level —
  # so the sandbox can deploy full stacks (SAM/CDK role creation included)
  # but can never mint anything more privileged than itself, create IAM
  # users/access keys, or tamper with the boundary. The statements here
  # deliberately mirror the execution role's ScopedIamWrites policy so that
  # roles created by created roles are capped identically (self-propagating).
  # Name is fixed (not stack-derived) because the in-VM CLAUDE.md briefing
  # must be able to state the ARN statically — repo convention, same as the
  # hardcoded /ipad-claude/* SSM prefix and function name.
  SandboxPermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: ipad-claude-sandbox-boundary
      Description: Caps IAM roles created from inside the sandbox at sandbox privilege level.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Broad service access, PowerUserAccess-shaped.
          - Sid: Services
            Effect: Allow
            NotAction: [iam:*, organizations:*, account:*]
            Resource: "*"
          - Sid: IamRead
            Effect: Allow
            Action: [iam:Get*, iam:List*, iam:SimulatePrincipalPolicy, iam:SimulateCustomPolicy]
            Resource: "*"
          - Sid: PassRole
            Effect: Allow
            Action: iam:PassRole
            Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/*"
          - Sid: BoundedRoleWrites
            Effect: Allow
            Action: [iam:CreateRole, iam:PutRolePolicy, iam:DeleteRolePolicy, iam:AttachRolePolicy, iam:DetachRolePolicy, iam:PutRolePermissionsBoundary]
            Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/*"
            Condition:
              StringEquals:
                iam:PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/ipad-claude-sandbox-boundary"
          - Sid: RoleLifecycle
            Effect: Allow
            Action: [iam:DeleteRole, iam:UpdateRole, iam:UpdateRoleDescription, iam:UpdateAssumeRolePolicy, iam:TagRole, iam:UntagRole, iam:CreateServiceLinkedRole]
            Resource: "*"
          - Sid: ManagePolicies
            Effect: Allow
            Action: [iam:CreatePolicy, iam:DeletePolicy, iam:CreatePolicyVersion, iam:DeletePolicyVersion, iam:SetDefaultPolicyVersion, iam:TagPolicy, iam:UntagPolicy]
            Resource: !Sub "arn:aws:iam::${AWS::AccountId}:policy/*"
          - Sid: InstanceProfiles
            Effect: Allow
            Action: [iam:CreateInstanceProfile, iam:DeleteInstanceProfile, iam:AddRoleToInstanceProfile, iam:RemoveRoleFromInstanceProfile, iam:TagInstanceProfile, iam:UntagInstanceProfile]
            Resource: !Sub "arn:aws:iam::${AWS::AccountId}:instance-profile/*"
          - Sid: DenyBoundaryTamper
            Effect: Deny
            Action: [iam:CreatePolicyVersion, iam:DeletePolicy, iam:DeletePolicyVersion, iam:SetDefaultPolicyVersion]
            Resource: !Sub "arn:aws:iam::${AWS::AccountId}:policy/ipad-claude-sandbox-boundary"
          - Sid: DenyBoundaryRemoval
            Effect: Deny
            Action: iam:DeleteRolePermissionsBoundary
            Resource: "*"
          - Sid: DenyTouchSandboxInfra
            Effect: Deny
            Action: iam:*
            Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/ipad-claude-*"

  # MicroVM execution role — the credential the sandbox operates with.
  # AWS managed PowerUserAccess (full service access minus IAM/Orgs), plus
  # inline Bedrock + S3 Files client-mount permissions, plus boundary-gated
  # IAM writes (ScopedIamWrites) so `sam deploy` / CDK work from inside the
  # sandbox without granting open-ended IAM. See README SECURITY.
  MicroVmExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition: { StringEquals: { aws:SourceAccount: !Ref AWS::AccountId } }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: BedrockAndS3Files
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The models are `us.anthropic.*` cross-region inference profiles.
              # Invoking one needs BOTH the inference-profile ARN (in the deploy
              # region) AND the underlying foundation-model ARNs in every region
              # the US profile can route to (us-east-1 / us-east-2 / us-west-2).
              # This is redundant while PowerUserAccess is attached, but makes the
              # README's "scope PowerUserAccess down" advice actually safe.
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-*"
                  - arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-*
                  - arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-*
                  - arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-*
              # Codex 0.154 provides the current Bedrock picker: GPT-6 Astra
              # and the GPT-5.6 Sol, Terra, and Luna family. Keep each active
              # US inference profile and its regional foundation-model routes
              # explicit so the grant remains useful if PowerUserAccess is
              # replaced with least-privilege policies later.
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.openai.gpt-6-astra"
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.openai.gpt-5.6-*"
                  - arn:aws:bedrock:us-east-1::foundation-model/openai.gpt-6-astra
                  - arn:aws:bedrock:us-east-2::foundation-model/openai.gpt-6-astra
                  - arn:aws:bedrock:us-west-2::foundation-model/openai.gpt-6-astra
                  - arn:aws:bedrock:us-east-1::foundation-model/openai.gpt-5.6-*
                  - arn:aws:bedrock:us-east-2::foundation-model/openai.gpt-5.6-*
                  - arn:aws:bedrock:us-west-2::foundation-model/openai.gpt-5.6-*
              - Effect: Allow
                Action: [s3files:ClientMount, s3files:ClientWrite]
                Resource: "*"
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:DeleteObject, s3:ListBucket]
                Resource: [!GetAtt WorkspaceBucket.Arn, !Sub "${WorkspaceBucket.Arn}/*"]
              # Call the AgentCore web-search Gateway over MCP (SigV4 via the
              # baked mcp-proxy-for-aws). The Gateway is created out-of-band by
              # deploy.sh, so the ARN can't be referenced directly. This grant
              # is scoped to all gateways in the account (a single gateway
              # exists). Redundant while PowerUserAccess is attached — it
              # already covers bedrock-agentcore — but explicit so the README's
              # "scope PowerUserAccess down" advice stays safe.
              - Effect: Allow
                Action: bedrock-agentcore:InvokeGateway
                Resource: !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/*"
        # IAM writes for in-sandbox deploys (sam deploy, CDK, etc.), gated by
        # the permissions boundary: any role created from the sandbox MUST
        # carry SandboxPermissionsBoundary, which caps it at sandbox level and
        # propagates the same cap to roles it creates in turn. Escalation
        # paths are closed: no boundary-free role writes, no IAM users or
        # access keys (never granted), no editing/removing the boundary, no
        # touching the sandbox's own ipad-claude-* roles.
        - PolicyName: ScopedIamWrites
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: IamRead
                Effect: Allow
                Action: [iam:Get*, iam:List*, iam:SimulatePrincipalPolicy, iam:SimulateCustomPolicy]
                Resource: "*"
              - Sid: PassRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/*"
              - Sid: BoundedRoleWrites
                Effect: Allow
                Action: [iam:CreateRole, iam:PutRolePolicy, iam:DeleteRolePolicy, iam:AttachRolePolicy, iam:DetachRolePolicy, iam:PutRolePermissionsBoundary]
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/*"
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref SandboxPermissionsBoundary
              - Sid: RoleLifecycle
                Effect: Allow
                Action: [iam:DeleteRole, iam:UpdateRole, iam:UpdateRoleDescription, iam:UpdateAssumeRolePolicy, iam:TagRole, iam:UntagRole, iam:CreateServiceLinkedRole]
                Resource: "*"
              - Sid: ManagePolicies
                Effect: Allow
                Action: [iam:CreatePolicy, iam:DeletePolicy, iam:CreatePolicyVersion, iam:DeletePolicyVersion, iam:SetDefaultPolicyVersion, iam:TagPolicy, iam:UntagPolicy]
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:policy/*"
              - Sid: InstanceProfiles
                Effect: Allow
                Action: [iam:CreateInstanceProfile, iam:DeleteInstanceProfile, iam:AddRoleToInstanceProfile, iam:RemoveRoleFromInstanceProfile, iam:TagInstanceProfile, iam:UntagInstanceProfile]
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:instance-profile/*"
              - Sid: DenyBoundaryTamper
                Effect: Deny
                Action: [iam:CreatePolicyVersion, iam:DeletePolicy, iam:DeletePolicyVersion, iam:SetDefaultPolicyVersion]
                Resource: !Ref SandboxPermissionsBoundary
              - Sid: DenyBoundaryRemoval
                Effect: Deny
                Action: iam:DeleteRolePermissionsBoundary
                Resource: "*"
              - Sid: DenyTouchSandboxInfra
                Effect: Deny
                Action: iam:*
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/ipad-claude-*"

  # ── Compute: token-vending Lambda + API ──────────────────────────────────────
  TokenApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowOrigin: "'*'"
        AllowMethods: "'GET,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        # Do NOT gate the CORS preflight (OPTIONS) behind the authorizer — the
        # browser sends OPTIONS without a token, so it must stay public.
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn

  TokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ipad-claude-token-vend
      CodeUri: functions/token-vend/
      Handler: index.handler
      Environment:
        Variables:
          ALLOWED_ORIGINS: "*"
          IMAGE_ARN: !GetAtt MicrovmImage.ImageArn
          EXECUTION_ROLE_ARN: !GetAtt MicroVmExecutionRole.Arn
          NETWORK_CONNECTOR_ARN: !GetAtt VpcEgressConnector.Arn
          S3_FILES_FS_ID: !GetAtt S3FilesFileSystem.FileSystemId
          WORKSPACE_BUCKET_ARN: !GetAtt WorkspaceBucket.Arn
      Policies:
        # SAM policy templates first:
        - SSMParameterWithSlashPrefixReadPolicy: { ParameterName: /ipad-claude/* }
        # Then inline for permissions with no policy-template equivalent:
        - Statement:
            - Sid: SsmWritePerUserState
              Effect: Allow
              Action: [ssm:PutParameter, ssm:GetParameter]
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ipad-claude/*"
            - Sid: PerUserAccessPoints
              Effect: Allow
              Action: [s3files:CreateAccessPoint, s3files:GetAccessPoint, s3files:ListAccessPoints, s3files:DeleteAccessPoint]
              Resource: "*"
            - Sid: MicroVmLifecycle
              Effect: Allow
              Action: lambda:*
              Resource: "*"
              Condition: { StringEquals: { aws:RequestedRegion: !Ref AWS::Region } }
            - Sid: PassExecutionRole
              Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt MicroVmExecutionRole.Arn
      Events:
        GetToken:
          Type: Api
          Properties:
            RestApiId: !Ref TokenApi
            Path: /token
            Method: get
        TerminateVm:
          Type: Api
          Properties:
            RestApiId: !Ref TokenApi
            Path: /token
            Method: delete

  # ── Frontend: S3 + CloudFront ─────────────────────────────────────────────────
  FrontendOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-frontend-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Remote Developer (rDev) frontend
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: frontend-s3
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOac
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: frontend-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          # Managed-CachingDisabled — the frontend injects live config, don't cache it.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html }

  # Bucket policy: allow only this CloudFront distribution (via OAC) to read.
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  # ── Egress: Lambda network connector (VPC egress for MicroVMs) ────────────────
  NetworkConnectorOperatorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com, network-connectors.lambda.amazonaws.com]
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EniManagement
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ec2:CreateNetworkInterface
                Resource:
                  - arn:aws:ec2:*:*:network-interface/*
                  - arn:aws:ec2:*:*:subnet/*
                  - arn:aws:ec2:*:*:security-group/*
              - Effect: Allow
                Action: ec2:CreateTags
                Resource: arn:aws:ec2:*:*:network-interface/*
                Condition:
                  StringEquals: { ec2:ManagedResourceOperator: network-connectors.lambda.amazonaws.com }

  VpcEgressConnector:
    Type: AWS::Lambda::NetworkConnector
    Properties:
      Name: ipad-claude-vpc-egress
      Configuration:
        VpcEgressConfiguration:
          SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
          SecurityGroupIds: [!Ref NfsSecurityGroup]
          NetworkProtocol: IPv4
          AssociatedComputeResourceTypes: [MicroVm]
      OperatorRole: !GetAtt NetworkConnectorOperatorRole.Arn

  # ── Web search: AgentCore Gateway service role ─────────────────────────────────
  # Native WebSearch/WebFetch are unavailable on Bedrock, so the in-VM Claude
  # gets a real web-search tool via AWS's managed web-search connector, exposed
  # over MCP behind an AgentCore Gateway with AWS_IAM inbound auth. The MicroVM
  # reaches it through the already-baked, pre-warmed `mcp-proxy-for-aws`
  # (SigV4-signed with the execution role's creds from IMDS), so there are no
  # API keys to manage and queries stay inside AWS.
  #
  # The Gateway + Target themselves are created out-of-band by deploy.sh (the
  # CFN resource handler has a serialization bug with the connector's empty
  # ParameterValues map that causes CREATE_FAILED). This role is the outbound
  # credential the Gateway uses to call the web-search tool.
  WebSearchGatewayRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-websearch-gw-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: bedrock-agentcore.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      Policies:
        - PolicyName: InvokeWebSearchConnector
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The tool ARN is AWS-owned (account = aws) and lives in us-east-1.
              - Effect: Allow
                Action: bedrock-agentcore:InvokeWebSearch
                Resource: arn:aws:bedrock-agentcore:us-east-1:aws:tool/web-search.v1

Outputs:
  TokenApiUrl:
    Description: Token-vending API endpoint.
    Value: !Sub "https://${TokenApi}.execute-api.${AWS::Region}.amazonaws.com/prod/token"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  LoginEmail:
    Description: Configured via the LoginEmail parameter (samconfig.toml or --parameter-overrides).
    Value: !Ref LoginEmail
  CreateUserCommand:
    Description: >-
      Run this once to create your first login. sam deploy prints this
      automatically — no need for deploy.sh to reconstruct it.
    Value: !Sub "aws cognito-idp admin-create-user --user-pool-id ${UserPool} --username ${LoginEmail} --user-attributes Name=email,Value=${LoginEmail} Name=email_verified,Value=true --temporary-password 'ChangeMe-123!'"
  FrontendUrl:
    Value: !Sub "https://${FrontendDistribution.DomainName}"
  FrontendBucketName:
    Value: !Ref FrontendBucket
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  WorkspaceBucketName:
    Value: !Ref WorkspaceBucket
  CloudFrontDistributionId:
    Value: !Ref FrontendDistribution
  BuildRoleArn:
    Value: !GetAtt MicroVmBuildRole.Arn
  ExecutionRoleArn:
    Value: !GetAtt MicroVmExecutionRole.Arn
  NetworkConnectorArn:
    Value: !GetAtt VpcEgressConnector.Arn
  S3FilesFileSystemId:
    Value: !GetAtt S3FilesFileSystem.FileSystemId
  WebSearchGatewayRoleArn:
    Description: IAM role used by the AgentCore web-search gateway (outbound connector auth).
    Value: !GetAtt WebSearchGatewayRole.Arn
  MicrovmImageArn:
    Description: ARN of the MicroVM image (created/updated as part of this stack).
    Value: !GetAtt MicrovmImage.ImageArn
